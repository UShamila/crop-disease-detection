services:
  model:
    build:
      context: .
      dockerfile: Dockerfile.render
    environment:
      PORT: "10000"
      ADMIN_API_KEY: local-load-test-key
    expose:
      - "10000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./tests/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - model